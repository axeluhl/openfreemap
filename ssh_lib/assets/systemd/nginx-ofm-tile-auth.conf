# Installed as /etc/systemd/system/nginx.service.d/ofm-tile-auth.conf
# Makes nginx depend on the boot-time tile-auth ingestion service, so a TILE_AUTH_SECRETS
# handed to the instance via EC2 user data is applied to the nginx config before nginx starts.
# ofm-tile-auth.service is resilient (a non-EC2 host or a transient IMDS failure still exits 0
# after rewriting the config from the baked config.json), so this hard dependency does not
# prevent nginx from starting in the common cases.
[Unit]
Requires=ofm-tile-auth.service
After=ofm-tile-auth.service
